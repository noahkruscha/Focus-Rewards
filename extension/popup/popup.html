<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus Rewards</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-row">
        <span class="brand-mark" aria-hidden="true">◈</span>
        <div><span class="brand-name">Focus Rewards</span><span class="brand-caption">YOUTUBE-ERWEITERUNG</span></div>
      </header>
      <section class="account-card" aria-labelledby="account-heading">
        <div class="account-indicator" aria-hidden="true"><span id="connection-dot"></span></div>
        <div class="account-copy">
          <h1 id="account-heading">Konto wird geprüft…</h1>
          <p id="account-detail" role="status" aria-live="polite">Verbindung zum Server wird überprüft.</p>
        </div>
      </section>
      <button id="account-action" class="primary-action" type="button" disabled>Erweiterung einrichten</button>
      <section class="pricing-controls" aria-labelledby="pricing-heading" hidden>
        <h2 id="pricing-heading">YouTube-Preise</h2>
        <label for="standard-rate">Standardvideos <output id="standard-rate-value">1,2</output> Coins/min</label>
        <input id="standard-rate" type="range" min="0.1" max="20" step="0.1" value="1.2" />
        <label for="shorts-rate">Shorts <output id="shorts-rate-value">1,4</output> Coins/min</label>
        <input id="shorts-rate" type="range" min="0.1" max="20" step="0.1" value="1.4" />
        <p>Flexible Nutzung <output id="flexible-rate-value" aria-readonly="true">1,6</output> Coins/min · <span id="flexible-status" role="status" aria-live="polite">Deaktiviert. Verfügbarkeit wird geprüft…</span></p>
        <button id="save-rates" type="button" disabled>Preise speichern</button>
        <p id="pricing-status" role="status" aria-live="polite"></p>
      </section>
      <footer><span>Dein Focus-Rewards-Konto. Deine Freischaltungen.</span></footer>
    </main>
  </body>
</html>
